services:
  secureauth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureauth-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=${APP_NAME:-SecureAuth}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-7fK9#vQ2@Lm8!Xp4$Ts1^Yw6&Nc3*Hd5Rj0ZbU7}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dP4!xV9@Qa2#Lm7$Tw5^Yc8&Nk1*Hs6Zj3RfU0Bg}
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL:-https://authenticator-daf9f-default-rtdb.asia-southeast1.firebasedatabase.app/}
      - FIREBASE_DATABASE_SECRET=${FIREBASE_DATABASE_SECRET:-Fs2NdylLNPOSLKSqlTf6FlIXYDbua91rSTgxzVnw}
      - TEXTSNAP_INSTANCE_ID=${TEXTSNAP_INSTANCE_ID:-7AF3D91BC6E452}
      - TEXTSNAP_ACCESS_TOKEN=${TEXTSNAP_ACCESS_TOKEN:-8CE4A72FD1B693}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
